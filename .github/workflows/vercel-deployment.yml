
name: Sync Vercel Production Deployment

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.error
      - vercel.deployment.failed
      - vercel.deployment.canceled

permissions:
  contents: read
  deployments: write

jobs:
  update-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub deployment record
        uses: actions/github-script@v7
        env:
          VERCEL_EVENT: ${{ github.event.action }}
          VERCEL_URL: ${{ github.event.client_payload.url }}
          VERCEL_SHA: ${{ github.event.client_payload.git.sha }}
          VERCEL_ENV: ${{ github.event.client_payload.environment }}

        with:
          script: |
            const event = process.env.VERCEL_EVENT;
            const sha = process.env.VERCEL_SHA;
            const url = process.env.VERCEL_URL;
            const environment = process.env.VERCEL_ENV;

            // Only track Production deployments
            if (String(environment).toLowerCase() !== "production") {
              core.info("Skipping non-production deployment.");
              return;
            }

            if (!sha) {
              throw new Error("Vercel commit SHA is missing.");
            }

            const states = {
              "vercel.deployment.success": "success",
              "vercel.deployment.error": "error",
              "vercel.deployment.failed": "failure",
              "vercel.deployment.canceled": "error"
            };

            const state = states[event];

            if (!state) {
              throw new Error(`Unsupported Vercel event: ${event}`);
            }

            // Create deployment record in GitHub
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              task: "deploy",
              auto_merge: false,
              required_contexts: [],
              environment: "production",
              description: "Vercel Production deployment",
              production_environment: true,
              transient_environment: false,
              payload: {
                provider: "Vercel",
                event: event,
                deployment_url: url || ""
              }
            });

            // Update its actual deployment status
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: state,
              environment: "production",
              environment_url: url || undefined,
              description:
                state === "success"
                  ? "Vercel Production deployment succeeded."
                  : `Vercel deployment ${event.split(".").pop()}.`
            });

            core.info(`GitHub deployment updated: ${state}`);
